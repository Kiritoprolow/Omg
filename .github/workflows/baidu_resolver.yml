name: Baidu Pan Resolver

# Được kích hoạt bởi HF Space qua GitHub Repository Dispatch API:
#   POST https://api.github.com/repos/{owner}/{repo}/dispatches
#   Body: {"event_type": "resolve_baidu_share", "client_payload": {...}}
on:
  repository_dispatch:
    types: [resolve_baidu_share]

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Chặn timeout job dài quá mức nếu Baidu API bị treo/rate-limit
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cài đặt baidupcs-py + requests
        run: |
          python -m pip install --upgrade pip
          pip install baidupcs-py requests

      - name: Resolve & transfer Baidu share vào Cloud cá nhân
        env:
          BAIDU_BDUSS: ${{ secrets.BAIDU_BDUSS }}
          BAIDU_STOKEN: ${{ secrets.BAIDU_STOKEN }}
          BAIDU_WEBHOOK_SECRET: ${{ secrets.BAIDU_WEBHOOK_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/resolve_baidu_share.py \
            '${{ github.event.client_payload.share_url }}' \
            '${{ github.event.client_payload.callback_url }}' \
            '${{ github.event.client_payload.job_id }}'
            
